<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Road Trip Jam</title>
<style>
  :root { --bg:#121212; --card:#1e1e1e; --line:#2c2c2c; --text:#fff; --muted:#a7a7a7; --accent:#1db954; --danger:#e25f5f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  #app { max-width:640px; margin:0 auto; padding:0 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 0 8px; }
  .brand { font-weight:800; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conn { font-size:12px; color:var(--muted); } .conn.online { color:var(--accent); }
  .now { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:10px; padding:12px; margin:8px 0 12px; }
  nav { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; background:none; border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:8px; font:inherit; }
  .tab.active { background:var(--text); color:#000; border-color:var(--text); font-weight:700; }
  h1 { font-size:26px; margin:24px 0 4px; } h2 { font-size:16px; margin:8px 0; }
  .muted { color:var(--muted); } .error { color:var(--danger); }
  .section-head { display:flex; justify-content:space-between; align-items:center; }
  ul.list { list-style:none; margin:0; padding:0; }
  .row { display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; background:var(--bg); transition:transform .12s; touch-action:pan-y; }
  .row.mine { background:#1a2a20; } .row.dragging { background:var(--card); box-shadow:0 4px 16px #000a; z-index:2; position:relative; transition:none; }
  .row + .row { margin-top:2px; }
  .art { width:44px; height:44px; border-radius:4px; background:var(--line); object-fit:cover; flex:none; }
  .info { flex:1; min-width:0; } .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .num { width:20px; text-align:right; color:var(--muted); font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .handle { color:var(--muted); padding:8px 4px; touch-action:none; cursor:grab; user-select:none; font-size:18px; letter-spacing:-3px; }
  .actions { display:flex; gap:2px; }
  button { font:inherit; cursor:pointer; }
  button.icon { background:none; border:none; color:var(--muted); padding:8px; border-radius:6px; min-width:36px; min-height:36px; }
  button.icon:disabled { opacity:.25; } button.danger:hover { color:var(--danger); }
  button.primary { background:var(--accent); color:#000; border:none; border-radius:22px; padding:12px 20px; font-weight:700; }
  button.primary.small { padding:8px 14px; font-size:14px; }
  input { width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:12px; font:inherit; margin:8px 0; }
  .join { display:flex; flex-direction:column; gap:4px; padding-top:8vh; }
  .toast { background:#3a1f1f; color:#ffb4b4; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .toast.info { background:#16301f; color:#a8f0c0; }
  .tools { display:flex; gap:8px; margin:4px 0 10px; }
  .chip { background:none; border:1px solid var(--line); color:var(--text); border-radius:18px; padding:6px 12px; font:inherit; font-size:14px; }
  .small { font-size:13px; } .spaced { margin-top:20px; }
  .rules { margin:0; padding-left:18px; color:var(--muted); } .rules li { margin:4px 0; }
  .tabs-inline { display:flex; gap:8px; margin:8px 0; }
  .row.collection .actions { gap:6px; align-items:center; }
  .sheet { position:fixed; inset:0; background:var(--bg); z-index:10; padding:16px; max-width:640px; margin:0 auto; overflow:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
