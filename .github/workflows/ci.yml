name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Android app is a shell around the deployed site; override with the CAP_SERVER_URL repository variable.
  CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://road-trip-mix.vercel.app' }}

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  android:
    name: Android build and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build

      # Builds the joiner page and syncs the Capacitor project.
      - name: Sync Capacitor project
        run: npm run android:sync

      - name: Native relay tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # Lets reviewers sideload what a PR does (debug-signed, so it can't update a release install).
      - uses: actions/upload-artifact@v4
        with:
          name: road-trip-mix-pr-${{ github.event.pull_request.number }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
